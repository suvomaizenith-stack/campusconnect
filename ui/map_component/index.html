<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --teal:#0E8A6D; --blue:#3B82F6; --amber:#F59E0B; --red:#EF4444; --green:#22C55E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Source Sans Pro", system-ui, sans-serif; overflow: hidden; }
  #vp { position: relative; width: 100%; overflow: hidden; border-radius: 14px; border: 1px solid rgba(120,140,135,.35);
        background: #eef3f0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #vp.dragging { cursor: grabbing; }
  #vp.pick { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; --inv: 1; }
  #world.smooth { transition: transform .42s cubic-bezier(.2,.8,.2,1); }
  #world img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  #outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #outline polygon { fill: rgba(14,138,109,.16); stroke: #0E8A6D; stroke-width: calc(3px * var(--inv));
                     stroke-dasharray: calc(10px * var(--inv)) calc(7px * var(--inv)); animation: march 1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: calc(-17px * var(--inv)); } }
  .mk { position: absolute; transform: translate(-50%, -50%) scale(var(--inv)); transform-origin: center; }
  .badge { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
           color: #fff; font-weight: 800; font-size: 13px; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer;
           animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  .badge:hover { filter: brightness(1.1); }
  .lvl-normal { background: var(--blue); } .lvl-hotspot { background: var(--amber); }
  .lvl-critical { background: var(--red); } .lvl-resolved { background: var(--green); }
  .badge.ring::after, .badge.pulse::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid currentColor; opacity: .7; }
  .badge.ring { color: var(--amber); } .badge.ring.lvl-critical { color: var(--red); }
  .badge.ring::after { animation: ripple 2s ease-out infinite; }
  .badge.pulse::after { animation: ripple 1.2s ease-out infinite; }
  .badge span { position: relative; z-index: 1; }
  @keyframes ripple { 0% { transform: scale(.7); opacity: .85; } 100% { transform: scale(2.1); opacity: 0; } }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0); } 100% { transform: translate(-50%,-50%) scale(var(--inv)); } }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); display: none; cursor: pointer; }
  #world.show-dots .dot { display: block; animation: pop .3s ease both; }
  .svc { width: 28px; height: 28px; border-radius: 8px; background: #fff; border: 2px solid var(--teal); display: flex; align-items: center;
         justify-content: center; font-size: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; }
  .pin { width: 0; height: 0; transform: translate(-50%, -100%) scale(var(--inv)); transform-origin: 50% 100%; }
  .pin i { position: absolute; left: -14px; top: -34px; width: 28px; height: 28px; background: #0E8A6D; border: 3px solid #fff;
           border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 3px 8px rgba(0,0,0,.45); animation: drop .55s cubic-bezier(.3,1.5,.5,1) both; }
  .pin i::after { content: ""; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  @keyframes drop { 0% { top: -120px; opacity: 0; } 100% { top: -34px; opacity: 1; } }
  .ctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .ctl button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(120,140,135,.5); background: rgba(255,255,255,.95);
                color: #14201C; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .12s; }
  .ctl button:hover { transform: scale(1.08); }
  .hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; background: rgba(14,138,109,.95); color: #fff;
          padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.3);
          animation: bob 2.4s ease-in-out infinite; pointer-events: none; white-space: nowrap; }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 3px); } }
  .legend { position: absolute; left: 10px; bottom: 10px; z-index: 5; background: rgba(255,255,255,.92); color: #14201C; border-radius: 10px;
            padding: 5px 9px; font-size: 11.5px; display: flex; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.2); pointer-events: none; }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #5F6F69; font-size: 14px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="vp">
  <div id="world"><img id="img" alt="Campus map" src="campus_map.png"><svg id="outline" viewBox="0 0 1600 1000" preserveAspectRatio="none"></svg><div id="layer"></div></div>
  <div class="ctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="zfit" title="Reset view">&#8634;</button></div>
  <div class="hint" id="hint" style="display:none">Tap where the problem is</div>
  <div class="legend"><span><b style="background:#3B82F6"></b>Open</span><span><b style="background:#F59E0B"></b>Hotspot 3+</span><span><b style="background:#EF4444"></b>Critical 5+</span><span><b style="background:#22C55E"></b>Resolved</span></div>
  <div class="banner" id="nomap">The campus map image is missing.</div>
</div>
<script>
(function () {
  var W = 1600, H = 1000, vp = document.getElementById('vp'), world = document.getElementById('world'),
      layer = document.getElementById('layer'), outline = document.getElementById('outline'), hint = document.getElementById('hint'),
      img = document.getElementById('img');
  var scale = 1, tx = 0, ty = 0, vw = 600, vh = 560, args = {}, userMoved = false, lastFocus = null, lastOverlay = '', lastOutline = '',
      lastPin = '', seqCounter = 0, DOT_ZOOM = 1.6, MAX_SCALE = 5;

  function send(type, extra) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in extra) msg[k] = extra[k];
    window.parent.postMessage(msg, '*');
  }
  function setHeight() { send('streamlit:setFrameHeight', { height: vh + 2 }); }
  function minScale() { return Math.min(vw / W, vh / H); }
  function clamp() {
    var w = W * scale, h = H * scale;
    tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, tx));
    ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, ty));
  }
  function apply(smooth) {
    clamp();
    world.classList.toggle('smooth', !!smooth);
    world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    world.style.setProperty('--inv', String(1 / scale));
    world.classList.toggle('show-dots', scale >= DOT_ZOOM);
  }
  function fit(smooth) { scale = minScale(); tx = ty = 0; apply(smooth); }
  function zoomAt(cx, cy, ns, smooth) {
    ns = Math.max(minScale(), Math.min(MAX_SCALE, ns));
    var wx = (cx - tx) / scale, wy = (cy - ty) / scale;
    scale = ns; tx = cx - wx * scale; ty = cy - wy * scale; apply(smooth);
  }
  function focusOn(x, y, zoom, smooth) {
    scale = Math.max(minScale(), Math.min(MAX_SCALE, zoom));
    tx = vw / 2 - x * W * scale; ty = vh / 2 - y * H * scale; apply(smooth);
  }

  function el(tag, cls, x, y) {
    var e = document.createElement(tag); e.className = cls;
    e.style.left = (x * W) + 'px'; e.style.top = (y * H) + 'px'; return e;
  }
  var ICONS = { helpdesk: '\u{1F6CE}️', security: '\u{1F6E1}️', medical: '⚕️', it_support: '\u{1F4BB}', info: 'ℹ️' };

  function drawLayer() {
    var o = args.overlay || {}, pin = args.pin;
    var key = JSON.stringify([o, pin]);
    if (key === lastOverlay) return;
    lastOverlay = key;
    layer.textContent = '';
    (o.services || []).forEach(function (s) {
      var e = el('div', 'mk svc', s.x, s.y); e.textContent = ICONS[s.icon] || ICONS.info; e.title = s.name; layer.appendChild(e);
    });
    (o.issues || []).forEach(function (i) {
      var e = el('div', 'mk dot lvl-' + i.level, i.x, i.y); e.title = i.title; layer.appendChild(e);
    });
    (o.badges || []).forEach(function (b, n) {
      var e = el('div', 'mk badge lvl-' + b.level + (b.ring ? ' ring' : '') + (b.pulse ? ' pulse' : ''), b.x, b.y);
      e.setAttribute('data-id', b.id); e.style.animationDelay = (n * 40) + 'ms';
      var s = document.createElement('span'); s.textContent = b.resolved ? '✓' : String(b.count); e.appendChild(s);
      e.title = b.resolved ? 'Resolved recently' : b.count + ' open report' + (b.count === 1 ? '' : 's'); layer.appendChild(e);
    });
    if (pin) { var p = el('div', 'mk pin', pin.x, pin.y); p.appendChild(document.createElement('i')); layer.appendChild(p); }
  }
  function drawOutline() {
    var polys = args.outline || [], key = JSON.stringify(polys);
    if (key === lastOutline) return;
    lastOutline = key; outline.textContent = '';
    polys.forEach(function (poly) {
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      g.setAttribute('points', poly.map(function (p) { return (p[0] * W) + ',' + (p[1] * H); }).join(' '));
      outline.appendChild(g);
    });
  }

  function emit(value) { value.seq = Date.now() * 1000 + (seqCounter++ % 1000); value.scale = scale; send('streamlit:setComponentValue', { value: value, dataType: 'json' }); }
  function toNorm(cx, cy) {
    var r = vp.getBoundingClientRect();
    return { nx: Math.min(1, Math.max(0, (cx - r.left - tx) / scale / W)), ny: Math.min(1, Math.max(0, (cy - r.top - ty) / scale / H)) };
  }

  var ptrs = {}, drag = null, pinch = null;
  function count() { return Object.keys(ptrs).length; }
  vp.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.ctl')) return;
    vp.setPointerCapture(e.pointerId); ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (count() === 1) { drag = { sx: e.clientX, sy: e.clientY, tx: tx, ty: ty, moved: false, badge: e.target.closest('.badge') }; }
    else if (count() === 2) {
      var a = Object.values(ptrs); pinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), s: scale }; if (drag) drag.moved = true;
    }
  });
  vp.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pinch && count() === 2) {
      var a = Object.values(ptrs), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), r = vp.getBoundingClientRect();
      zoomAt((a[0].x + a[1].x) / 2 - r.left, (a[0].y + a[1].y) / 2 - r.top, pinch.s * d / pinch.d); userMoved = true; return;
    }
    if (drag) {
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; vp.classList.add('dragging'); }
      if (drag.moved) { tx = drag.tx + dx; ty = drag.ty + dy; userMoved = true; apply(false); }
    }
  });
  function end(e) {
    if (!ptrs[e.pointerId]) return;
    var wasClick = drag && !drag.moved && count() === 1 && e.type === 'pointerup', d = drag;
    delete ptrs[e.pointerId];
    if (count() < 2) pinch = null;
    if (count() === 0) { drag = null; vp.classList.remove('dragging'); }
    if (wasClick) {
      var n = toNorm(e.clientX, e.clientY);
      if (d.badge) n.badge = d.badge.getAttribute('data-id');
      emit(n);
    }
  }
  vp.addEventListener('pointerup', end); vp.addEventListener('pointercancel', end);
  vp.addEventListener('wheel', function (e) {
    e.preventDefault(); var r = vp.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, scale * Math.exp(-e.deltaY * 0.0016)); userMoved = true;
  }, { passive: false });
  document.getElementById('zin').onclick = function () { zoomAt(vw / 2, vh / 2, scale * 1.5, true); userMoved = true; };
  document.getElementById('zout').onclick = function () { zoomAt(vw / 2, vh / 2, scale / 1.5, true); userMoved = true; };
  document.getElementById('zfit').onclick = function () { fit(true); userMoved = false; };
  img.addEventListener('error', function () { document.getElementById('nomap').style.display = 'flex'; });

  function layout() {
    vw = vp.clientWidth || 600; vh = args.height || 560; vp.style.height = vh + 'px';
    world.style.width = W + 'px'; world.style.height = H + 'px';
    setHeight();
  }
  new ResizeObserver(function () { var old = vw; layout(); if (!userMoved || vw !== old) { if (!userMoved) fit(false); else apply(false); } }).observe(vp);

  window.addEventListener('message', function (ev) {
    if (!ev.data || ev.data.type !== 'streamlit:render') return;
    args = ev.data.args || {};
    W = args.width_px || 1600; H = args.height_px || 1000;
    outline.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    vp.classList.toggle('pick', args.mode === 'pick');
    hint.style.display = args.mode === 'pick' && !args.pin ? 'block' : 'none';
    var first = !world.getAttribute('data-ready');
    layout();
    if (first) { world.setAttribute('data-ready', '1'); fit(false); }
    drawLayer(); drawOutline();
    var f = args.focus;
    if (f && f.seq !== lastFocus) { lastFocus = f.seq; focusOn(f.x, f.y, f.zoom || 2, true); userMoved = true; }
  });
  send('streamlit:componentReady', { apiVersion: 1 });
})();
</script>
</body>
</html>
